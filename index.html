<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mythos Running Club - Ảnh 04/06/2026</title>
    
    <link rel="icon" type="image/png" href="logo.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #050508 0%, #0b0f19 100%);
            --panel-bg: rgba(15, 22, 36, 0.7);
            --border-glass: rgba(255, 255, 255, 0.08);
            --accent-blue: linear-gradient(90deg, #1e40af, #3b82f6);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- HEADER --- */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.5rem 2rem;
            background: rgba(5, 5, 8, 0.6);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glass);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        /* HIỂN THỊ LOGO TRÊN HEADER */
        .header-brand img {
            height: 45px;
            width: 45px;
            object-fit: contain;
            border-radius: 6px;
        }

        .header-brand h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(180deg, #ffffff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-underline {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #3b82f6, transparent);
            box-shadow: 0 0 10px #3b82f6;
        }

        /* --- MAIN LAYOUT --- */
        main {
            max-width: 1600px;
            margin: 2rem auto;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 2rem;
        }

        @media (max-width: 1024px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        /* --- INFO PANEL --- */
        .control-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            height: fit-content;
            position: sticky;
            top: 100px;
        }

        .panel-title {
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #fff;
        }

        .stats-display {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.75rem;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 1.25rem;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.02);
        }

        .stat-val {
            font-size: 2rem;
            font-weight: 700;
            color: #3b82f6;
            text-shadow: 0 0 15px rgba(59,130,246,0.3);
        }

        .stat-lbl {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* --- GALLERY WORKSPACE --- */
        .gallery-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            grid-auto-rows: 220px;
            gap: 1.5rem;
        }

        .gallery-card {
            position: relative;
            background: var(--panel-bg);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            transform: translateZ(0);
        }

        /* Bố cục Grid so le cao cấp (Masonry-like) */
        .gallery-card:nth-child(5n+1) {
            grid-column: span 1;
            grid-row: span 2;
        }
        .gallery-card:nth-child(5n+3) {
            grid-column: span 2;
            grid-row: span 1;
        }

        @media (max-width: 640px) {
            .gallery-card:nth-child(5n+1),
            .gallery-card:nth-child(5n+3) {
                grid-column: span 1 !important;
                grid-row: span 1 !important;
            }
            .grid-layout {
                grid-auto-rows: 250px;
            }
        }

        .gallery-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .gallery-card:hover img {
            transform: scale(1.06);
            filter: brightness(1.1);
        }

        .card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(5,5,8,0.8) 0%, rgba(5,5,8,0) 50%);
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: flex-end;
            padding: 1rem;
        }

        .gallery-card:hover .card-overlay {
            opacity: 1;
        }

        .card-filename {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
            width: 100%;
        }

        .skeleton {
            background: linear-gradient(90deg, #0f1624 25%, #1e293b 50%, #0f1624 75%);
            background-size: 200% 100%;
            animation: loading-skeleton 1.5s infinite;
        }

        @keyframes loading-skeleton {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* --- LIGHTBOX MODAL --- */
        .lightbox-modal {
            position: fixed;
            inset: 0;
            background: rgba(4, 5, 7, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .lightbox-modal.active {
            display: flex;
            opacity: 1;
        }

        .lightbox-content-wrapper {
            position: relative;
            width: 90vw;
            height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-img-container {
            max-width: 100%;
            max-height: 100%;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-image {
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 4px;
            transform: scale(1);
            transition: transform 0.1s ease-out, opacity 0.2s ease;
            cursor: grab;
        }

        .lightbox-image:active {
            cursor: grabbing;
        }

        .lightbox-ui-btn {
            position: absolute;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            transition: all 0.2s ease;
            z-index: 1010;
            backdrop-filter: blur(4px);
        }

        .lightbox-ui-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
        }

        .btn-close-lightbox { top: -40px; right: 0; }
        .btn-download-lightbox { top: -40px; right: 60px; }
        .btn-prev-lightbox { left: 20px; top: 50%; transform: translateY(-50%); }
        .btn-next-lightbox { right: 20px; top: 50%; transform: translateY(-50%); }

        @media (max-width: 768px) {
            .btn-prev-lightbox { left: 5px; }
            .btn-next-lightbox { right: 5px; }
            .lightbox-content-wrapper { width: 98vw; }
        }

        .empty-gallery-msg {
            grid-column: 1 / -1;
            padding: 4rem 2rem;
            text-align: center;
            background: var(--panel-bg);
            border: 1px dashed var(--border-glass);
            border-radius: 12px;
            color: var(--text-secondary);
        }

        .empty-gallery-msg i {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

    <header>
        <div class="header-brand">
            <img src="logo.png" alt="Mythos Running Club Logo" onerror="this.style.display='none';">
            <h1>Mythos Running Club Gallery</h1>
        </div>
        <div class="header-underline"></div>
    </header>

    <main>
        <aside class="control-panel">
            <div class="panel-title">
                <i class="fa-solid fa-images"></i>
                <span>Album Dashboard</span>
            </div>

            <div class="stats-display">
                <div class="stat-card">
                    <div class="stat-val" id="stat-total">0</div>
                    <div class="stat-lbl">Total Media Assets</div>
                </div>
            </div>
            
            <p style="font-size: 0.75rem; color: var(--text-secondary); line-height: 1.4; text-align: center;">
                Nhấp vào bất kỳ mục nào trong lưới ảnh để kích hoạt khung xem ảnh chi tiết độ phân giải cao 
            </p>
        </aside>

        <section class="gallery-container">
            <div class="grid-layout" id="gallery-grid">
                <div class="empty-gallery-msg" id="initial-loading-view">
                    <i class="fa-solid fa-circle-notch fa-spin"></i>
                    <p>Đang quét dữ liệu, vui lòng chờ.</p>
                </div>
            </div>
        </section>
    </main>

    <div class="lightbox-modal" id="lightbox-modal">
        <div class="lightbox-content-wrapper">
            <button class="lightbox-ui-btn btn-close-lightbox" id="lb-close" title="Close (Esc)"><i class="fa-solid fa-xmark"></i></button>
            <button class="lightbox-ui-btn btn-download-lightbox" id="lb-download" title="Download Original"><i class="fa-solid fa-download"></i></button>
            <button class="lightbox-ui-btn btn-prev-lightbox" id="lb-prev" title="Previous KeyLeft"><i class="fa-solid fa-chevron-left"></i></button>
            <div class="lightbox-img-container" id="lb-img-container">
                <img src="" alt="Enlarged View" class="lightbox-image" id="lightbox-image" draggable="false">
            </div>
            <button class="lightbox-ui-btn btn-next-lightbox" id="lb-next" title="Next KeyRight"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
    </div>

    <script>
        const CONFIG = {
            IMAGE_DIRECTORY: '/images',
            MAX_SCAN_FALLBACK_INDEX: 150 // Quét thoải mái từ 1.jpg tới 150.jpg (Đủ cho 124 ảnh của bạn)
        };

        let appState = {
            galleryManifest: [],
            activeLightboxIndex: -1
        };

        const dom = {
            statTotal: document.getElementById('stat-total'),
            galleryGrid: document.getElementById('gallery-grid'),
            lightbox: document.getElementById('lightbox-modal'),
            lightboxImg: document.getElementById('lightbox-image'),
            lbClose: document.getElementById('lb-close'),
            lbDownload: document.getElementById('lb-download'),
            lbPrev: document.getElementById('lb-prev'),
            lbNext: document.getElementById('lb-next'),
            lbImgContainer: document.getElementById('lb-img-container')
        };

        // ĐỒNG BỘ ĐƯỜNG DẪN FILE TĨNH TỰ ĐỘNG
        async function discoverGalleryAssets() {
            const extensions = ['jpg', 'jpeg', 'png', 'webp', 'JPG', 'PNG'];
            const discoveryStack = [];
            
            for (let i = 1; i <= CONFIG.MAX_SCAN_FALLBACK_INDEX; i++) {
                extensions.forEach(ext => {
                    discoveryStack.push(probeImageUrl(`${CONFIG.IMAGE_DIRECTORY}/${i}.${ext}`));
                });
            }

            const results = await Promise.all(discoveryStack);
            appState.galleryManifest = results.filter(url => url !== null);
            appState.galleryManifest = [...new Set(appState.galleryManifest)];
            
            dom.statTotal.textContent = appState.galleryManifest.length;
            renderGalleryBaseGrid();
        }

        function probeImageUrl(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(url);
                img.onerror = () => resolve(null);
                img.src = url;
            });
        }

        function renderGalleryBaseGrid() {
            if (appState.galleryManifest.length === 0) {
                dom.galleryGrid.innerHTML = `
                    <div class="empty-gallery-msg">
                        <i class="fa-solid fa-images"></i>
                        <p>No images detected in <code>/images</code> folder.</p>
                        <p style="font-size:0.75rem; color: var(--text-secondary); margin-top:0.5rem;">
                           Make sure your images are named 1.jpg to 124.jpg inside the /images directory.
                        </p>
                    </div>`;
                return;
            }

            dom.galleryGrid.innerHTML = '';
            appState.galleryManifest.forEach((imgUrl, index) => {
                const card = document.createElement('div');
                card.className = 'gallery-card';
                card.dataset.index = index;
                card.dataset.src = imgUrl;

                card.innerHTML = `
                    <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" class="skeleton" data-src="${imgUrl}" alt="Club Photo">
                    <div class="card-overlay">
                        <div class="card-filename">${imgUrl.substring(imgUrl.lastIndexOf('/') + 1)}</div>
                    </div>
                `;

                card.addEventListener('click', () => launchLightbox(index));
                dom.galleryGrid.appendChild(card);
            });

            initializeLazyLoading();
        }

        function initializeLazyLoading() {
            const lazyImages = document.querySelectorAll('.gallery-card img[data-src]');
            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        img.src = img.dataset.src;
                        img.onload = () => img.classList.remove('skeleton');
                        observer.unobserve(img);
                    }
                });
            }, { rootMargin: '300px 0px' });

            lazyImages.forEach(img => observer.observe(img));
        }

        /* --- LIGHTBOX MECHANICS --- */
        let currentZoomScale = 1;
        let isPanningActive = false;
        let panStartX = 0, panStartY = 0, currentPanX = 0, currentPanY = 0;

        function launchLightbox(index) {
            if (index < 0 || index >= appState.galleryManifest.length) return;
            appState.activeLightboxIndex = index;
            const targetUrl = appState.galleryManifest[index];
            
            dom.lightboxImg.style.opacity = '0';
            dom.lightbox.classList.add('active');

            const bufferImg = new Image();
            bufferImg.src = targetUrl;
            bufferImg.onload = () => {
                dom.lightboxImg.src = targetUrl;
                dom.lightboxImg.style.opacity = '1';
                resetZoomParameters();
            };
        }

        function closeLightbox() {
            dom.lightbox.classList.remove('active');
            appState.activeLightboxIndex = -1;
        }

        function navigateLightbox(offset) {
            let nextIndex = appState.activeLightboxIndex + offset;
            if (nextIndex >= appState.galleryManifest.length) nextIndex = 0;
            if (nextIndex < 0) nextIndex = appState.galleryManifest.length - 1;
            launchLightbox(nextIndex);
        }

        function downloadActiveOriginalAsset() {
            if (appState.activeLightboxIndex === -1) return;
            const url = appState.galleryManifest[appState.activeLightboxIndex];
            const linkAnchor = document.createElement('a');
            linkAnchor.href = url;
            linkAnchor.download = url.substring(url.lastIndexOf('/') + 1);
            document.body.appendChild(linkAnchor);
            linkAnchor.click();
            document.body.removeChild(linkAnchor);
        }

        dom.lbClose.addEventListener('click', closeLightbox);
        dom.lbPrev.addEventListener('click', () => navigateLightbox(-1));
        dom.lbNext.addEventListener('click', () => navigateLightbox(1));
        dom.lbDownload.addEventListener('click', downloadActiveOriginalAsset);

        dom.lightbox.addEventListener('click', (e) => {
            if (e.target === dom.lightbox || e.target === dom.lbImgContainer) closeLightbox();
        });

        window.addEventListener('keydown', (e) => {
            if (appState.activeLightboxIndex !== -1) {
                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowRight') navigateLightbox(1);
                if (e.key === 'ArrowLeft') navigateLightbox(-1);
            }
        });

        dom.lbImgContainer.addEventListener('wheel', (e) => {
            if (appState.activeLightboxIndex === -1) return;
            e.preventDefault();
            if (e.deltaY < 0) currentZoomScale = Math.min(currentZoomScale + 0.1, 5);
            else currentZoomScale = Math.max(currentZoomScale - 0.1, 1);
            
            if (currentZoomScale === 1) { currentPanX = 0; currentPanY = 0; }
            applyTransformationMatrix();
        }, { passive: false });

        function resetZoomParameters() {
            currentZoomScale = 1; currentPanX = 0; currentPanY = 0;
            applyTransformationMatrix();
        }

        function applyTransformationMatrix() {
            dom.lightboxImg.style.transform = `translate(${currentPanX}px, ${currentPanY}px) scale(${currentZoomScale})`;
        }

        dom.lightboxImg.addEventListener('mousedown', (e) => {
            if (currentZoomScale > 1) {
                isPanningActive = true;
                panStartX = e.clientX - currentPanX;
                panStartY = e.clientY - currentPanY;
                e.preventDefault();
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isPanningActive && currentZoomScale > 1) {
                currentPanX = e.clientX - panStartX;
                currentPanY = e.clientY - panStartY;
                applyTransformationMatrix();
            }
        });

        window.addEventListener('mouseup', () => isPanningActive = false);

        let touchSwipeStartX = 0;
        dom.lightbox.addEventListener('touchstart', (e) => touchSwipeStartX = e.changedTouches[0].clientX, { passive: true });
        dom.lightbox.addEventListener('touchend', (e) => {
            if (currentZoomScale > 1) return;
            let swipeDeltaX = e.changedTouches[0].clientX - touchSwipeStartX;
            if (Math.abs(swipeDeltaX) > 60) {
                if (swipeDeltaX > 0) navigateLightbox(-1);
                else navigateLightbox(1);
            }
        }, { passive: true });

        window.addEventListener('DOMContentLoaded', discoverGalleryAssets);
    </script>
</body>
</html>
