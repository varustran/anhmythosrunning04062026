<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mythos Running Club - Face Search Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            --glass-bg: rgba(30, 41, 59, 0.5);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-primary: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            --accent-hover: linear-gradient(135deg, #60a5fa 0%, #2563eb 100%);
            --success-glow: 0 0 25px rgba(34, 197, 94, 0.6);
            --success-border: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Glassmorphism utility */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
        }

        /* Header Layout */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(15, 23, 42, 0.8);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .brand img {
            height: 45px;
            width: auto;
            object-fit: contain;
        }

        .brand h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Main Workspace Container */
        main {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 2rem;
        }

        @media (max-width: 1024px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        /* Control Panel / Sidebar */
        .search-sidebar {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            align-self: start;
            position: sticky;
            top: 100px;
        }

        .panel-padding {
            padding: 1.5rem;
        }

        .panel-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #f1f5f9;
        }

        /* System Status / Init Tracker */
        #system-status {
            font-size: 0.85rem;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            background: rgba(234, 179, 8, 0.1);
            border: 1px solid rgba(234, 179, 8, 0.2);
            color: #fde047;
        }

        #system-status.ready {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.2);
            color: #4ade80;
        }

        /* Dropzone Component */
        .upload-zone {
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 2rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            background: rgba(15, 23, 42, 0.3);
        }

        .upload-zone:hover {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.05);
        }

        .upload-zone i {
            font-size: 2.5rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            transition: color 0.3s;
        }

        .upload-zone:hover i {
            color: #3b82f6;
        }

        .upload-zone input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        /* Crop & Picker Layout */
        .face-picker-container {
            margin-top: 1.5rem;
            display: none;
        }

        .face-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 0.75rem;
            margin-top: 0.75rem;
        }

        .face-thumb-wrapper {
            position: relative;
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
            background: #020617;
        }

        .face-thumb-wrapper:hover {
            transform: scale(1.05);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .face-thumb-wrapper.selected {
            border-color: #3b82f6;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.6);
        }

        .face-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Engine Log Tracking Feedback */
        .search-progress-box {
            display: none;
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .progress-bar-bg {
            background: rgba(255, 255, 255, 0.1);
            height: 6px;
            border-radius: 3px;
            margin-top: 0.5rem;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: var(--accent-primary);
            height: 100%;
            width: 0%;
            transition: width 0.1s ease;
        }

        /* Global Controls Section */
        .actions-box {
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            flex: 1;
            background: var(--accent-primary);
            color: white;
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn:hover:not(:disabled) {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: #334155;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-main);
        }

        .btn-secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.05);
        }

        /* Gallery Grid Workspace */
        .gallery-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .gallery-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
        }

        .counter-badge {
            background: rgba(255, 255, 255, 0.08);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        /* Image Card Components */
        .photo-card {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 4/3;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            background: #0f172a;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .photo-card:hover img {
            transform: scale(1.06);
        }

        /* Match Glowing Overlay States */
        .photo-card.matched {
            border: 3px solid var(--success-border);
            box-shadow: var(--success-glow);
            transform: scale(1.02);
            z-index: 10;
        }

        .photo-card.not-matched {
            opacity: 0.25;
            filter: grayscale(80%);
        }

        .card-meta {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(2, 6, 23, 0.9));
            padding: 1.25rem 1rem 0.75rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .photo-card:hover .card-meta, 
        .photo-card.matched .card-meta {
            transform: translateY(0);
        }

        .card-title {
            font-size: 0.85rem;
            font-weight: 500;
            color: #f8fafc;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
            max-width: 70%;
        }

        .match-score {
            font-size: 0.75rem;
            font-weight: 600;
            background: #22c55e;
            color: #052e16;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
        }

        /* Pulse Animations */
        .pulse-icon {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <img src="logo.png" alt="Mythos Logo" onerror="this.src='https://placehold.co/150x50/1e293b/ffffff?text=Mythos+RC'">
            <h1>Mythos Running Club Gallery</h1>
        </div>
        <div class="counter-badge" id="global-stats">System Idle</div>
    </header>

    <main>
        <section class="search-sidebar">
            <div class="glass-panel panel-padding">
                <div class="panel-title">
                    <i class="fa-solid fa-brain text-blue-500"></i>
                    <span>AI Recognition Engine</span>
                </div>
                
                <div id="system-status">
                    <i class="fa-solid fa-circle-notch fa-spin"></i>
                    <span id="status-text">Booting core libraries...</span>
                </div>

                <div class="upload-zone" id="dropzone">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <p style="font-weight: 500; font-size: 0.95rem; margin-bottom: 0.25rem;">Upload Reference Face</p>
                    <p style="color: var(--text-muted); font-size: 0.8rem;">Drag & drop or click to browse</p>
                    <input type="file" id="user-photo-input" accept="image/*" disabled>
                </div>

                <div class="face-picker-container" id="picker-area">
                    <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem;">
                        <i class="fa-solid fa-crosshairs"></i> Select identity to search for:
                    </p>
                    <div class="face-grid" id="detected-faces-pool"></div>
                </div>

                <div class="search-progress-box" id="engine-progress-panel">
                    <div style="display: flex; justify-content: space-between; font-size: 0.8rem;" id="progress-text-container">
                        <span style="color: var(--text-muted);" id="progress-step-lbl">Processing...</span>
                        <span style="font-weight: 600;" id="progress-percent-lbl">0%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="progress-bar-core"></div>
                    </div>
                </div>
            </div>

            <div class="glass-panel panel-padding actions-box">
                <button class="btn btn-secondary" id="reset-search-btn" disabled>
                    <i class="fa-solid fa-arrow-rotate-left"></i> Reset
                </button>
                <button class="btn" id="execute-search-btn" disabled>
                    <i class="fa-solid fa-magnifying-glass"></i> Find Matches
                </button>
            </div>
        </section>

        <section class="gallery-container">
            <div class="glass-panel gallery-toolbar">
                <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <span style="font-weight: 600; font-size: 1.1rem;">Club Photo Stream</span>
                    <span class="counter-badge" id="total-assets-count">0 files detected</span>
                </div>
                <div id="match-counter-display" style="font-size: 0.9rem; font-weight: 500; color: #4ade80; display: none;">
                    <i class="fa-solid fa-square-check"></i> Found <span id="match-count-val">0</span> photos matching your identity
                </div>
            </div>

            <div class="gallery-grid" id="main-photo-grid-stream">
                </div>
        </section>
    </main>

    <script>
        /**
         * STATIC MANIFEST IMAGES REFERENCE ARRAY
         * Configure here the local paths of images residing inside your project’s /images directory.
         * The framework automatically hooks these files for the asynchronous deep learning runtime scan ecosystem.
         */
        const TRACKED_GALLERY_IMAGES = [
            'images/run1.jpg',
            'images/run2.jpg',
            'images/run3.jpg',
            'images/run4.jpg',
            'images/run5.jpg',
            'images/run6.jpg',
            'images/run7.jpg',
            'images/run8.jpg'
        ];

        // Production-Ready Model Weight Endpoints mapped directly via Vladmandic standard optimized CDN architectures
        const CDN_MODEL_BASE = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/";

        // State Machine Context Engine
        const SystemState = {
            modelsReady: false,
            uploadedImageElement: null,
            detectedFaceDescriptors: [],
            selectedFaceIndex: null,
            galleryDescriptorsMap: new Map(), // Mapping file paths directly to compiled extraction results
            matchThreshold: 0.50
        };

        // Execution DOM Architecture Selectors
        const DOM = {
            statusBox: document.getElementById('system-status'),
            statusText: document.getElementById('status-text'),
            fileInput: document.getElementById('user-photo-input'),
            dropzone: document.getElementById('dropzone'),
            pickerArea: document.getElementById('picker-area'),
            facesPool: document.getElementById('detected-faces-pool'),
            progressPanel: document.getElementById('engine-progress-panel'),
            progressLabel: document.getElementById('progress-step-lbl'),
            progressPercent: document.getElementById('progress-percent-lbl'),
            progressBar: document.getElementById('progress-bar-core'),
            btnSearch: document.getElementById('execute-search-btn'),
            btnReset: document.getElementById('reset-search-btn'),
            galleryGrid: document.getElementById('main-photo-grid-stream'),
            totalAssetsCount: document.getElementById('total-assets-count'),
            matchCounterDisplay: document.getElementById('match-counter-display'),
            matchCountVal: document.getElementById('match-count-val'),
            globalStats: document.getElementById('global-stats')
        };

        // Application Lifecycles Entry point
        window.addEventListener('DOMContentLoaded', async () => {
            initializeLayoutPlaceholderGallery();
            await bootNeuralPipelines();
        });

        // Initialize Static Layout Elements Previews
        function initializeLayoutPlaceholderGallery() {
            DOM.galleryGrid.innerHTML = '';
            DOM.totalAssetsCount.textContent = `${TRACKED_GALLERY_IMAGES.length} photos trackable`;
            
            TRACKED_GALLERY_IMAGES.forEach((imagePath, index) => {
                const card = document.createElement('div');
                card.className = 'photo-card glass-panel';
                card.dataset.path = imagePath;
                card.dataset.index = index;

                const img = document.createElement('img');
                img.src = imagePath;
                img.alt = `Gallery Item ${index + 1}`;
                img.loading = 'lazy';
                // Inline placeholder error fallback routine architecture handling gracefully missing static assets assets
                img.onerror = () => {
                    img.src = `https://placehold.co/600x450/1e293b/ffffff?text=Image+Not+Found`;
                };

                const meta = document.createElement('div');
                meta.className = 'card-meta';
                
                // Truncated clean processing filename parsing
                const filename = imagePath.split('/').pop();
                meta.innerHTML = `
                    <span class="card-title">${filename}</span>
                    <span class="match-score" style="display:none;">Match</span>
                `;

                card.appendChild(img);
                card.appendChild(meta);
                DOM.galleryGrid.appendChild(card);
            });
        }

        // Parallel Booting Strategy of Weights Architecture Components via Asynchronous Execution
        async function bootNeuralPipelines() {
            try {
                updateEngineStatus('Loading weights architecture components...', false);
                
                // Execute simultaneous CDN downloads via face-api.js core pipeline configurations
                await Promise.all([
                    faceapi.nets.ssdMobilenetv1.loadFromUri(CDN_MODEL_BASE),
                    faceapi.nets.faceLandmarks68Net.loadFromUri(CDN_MODEL_BASE),
                    faceapi.nets.faceRecognitionNet.loadFromUri(CDN_MODEL_BASE)
                ]);

                SystemState.modelsReady = true;
                DOM.statusBox.className = 'ready';
                DOM.statusText.textContent = "AI Engine Active & Primed";
                DOM.globalStats.textContent = "Engine Ready";
                DOM.fileInput.removeAttribute('disabled');
                
                setupControlPanelEventListeners();
            } catch (err) {
                console.error("Critical Model Initialization Failure Event Occurred: ", err);
                DOM.statusText.textContent = "Failed initialization models base weights. Check network connection paths.";
                DOM.statusBox.style.background = "rgba(239, 68, 68, 0.1)";
                DOM.statusBox.style.borderColor = "rgba(239, 68, 68, 0.2)";
                DOM.statusBox.style.color = "#f87171";
            }
        }

        function updateEngineStatus(msg, isCompleted = false) {
            DOM.statusText.textContent = msg;
            DOM.globalStats.textContent = msg;
        }

        function setupControlPanelEventListeners() {
            // Setup Upload Event System Interactivity mapping
            DOM.fileInput.addEventListener('change', handleSourceIdentitySelectionFile);
            
            DOM.dropzone.addEventListener('dragover', (e) => {
                e.preventDefault();
                DOM.dropzone.style.borderColor = '#3b82f6';
            });

            DOM.dropzone.addEventListener('dragleave', () => {
                DOM.dropzone.style.borderColor = 'rgba(255, 255, 255, 0.15)';
            });

            DOM.dropzone.addEventListener('drop', (e) => {
                e.preventDefault();
                DOM.dropzone.style.borderColor = 'rgba(255, 255, 255, 0.15)';
                if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                    DOM.fileInput.files = e.dataTransfer.files;
                    handleSourceIdentitySelectionFile();
                }
            });

            // Action triggers registration layout interface mapping
            DOM.btnSearch.addEventListener('click', executeParallelGalleryFacialScan);
            DOM.btnReset.addEventListener('click', hardResetSearchEngineWorkspaceUX);
        }

        // Image Selection Extraction Preprocessing Layout Pipeline Engine logic routing
        async function handleSourceIdentitySelectionFile() {
            const file = DOM.fileInput.files[0];
            if (!file) return;

            // Reset workspace interface variables state parameters cleanly
            clearDetectedFacesPreviewPool();
            resetGalleryCardsVisualStates();

            updateEngineStatus("Analyzing uploaded face data...", false);
            DOM.progressPanel.style.display = 'block';
            updateProgressBarUI("Detecting structural landmarks...", 25);

            try {
                // Parse file element configuration dynamically onto native Image element wrappers mapping pipeline
                const imageElement = await faceapi.bufferToImage(file);
                SystemState.uploadedImageElement = imageElement;

                // Fire computational facial detection algorithm architecture models configuration definitions runtimes
                const extractions = await faceapi.detectAllFaces(imageElement)
                                                 .withFaceLandmarks()
                                                 .withFaceDescriptors();

                SystemState.detectedFaceDescriptors = extractions;

                if (extractions.length === 0) {
                    updateEngineStatus("Zero faces detected in source reference. Try another file.", false);
                    updateProgressBarUI("Execution terminated", 0);
                    return;
                }

                updateEngineStatus(`Identified ${extractions.length} face signatures inside matrix context.`, true);
                updateProgressBarUI("Rendering face bounding parameters...", 100);
                setTimeout(() => { DOM.progressPanel.style.display = 'none'; }, 1000);

                // Render components inside selection matrix context
                DOM.pickerArea.style.display = 'block';
                
                for (let i = 0; i < extractions.length; i++) {
                    const detection = extractions[i].detection;
                    const box = detection.box;

                    // Dynamically generate Canvas object to draw cropped thumbnails
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = 120;
                    canvas.height = 120;

                    // Expand bounds slightly to crop a cleaner face thumbnail preview
                    const padding = 0.1;
                    const sourceX = Math.max(0, box.x - box.width * padding);
                    const sourceY = Math.max(0, box.y - box.height * padding);
                    const sourceWidth = Math.min(imageElement.width - sourceX, box.width * (1 + padding * 2));
                    const sourceHeight = Math.min(imageElement.height - sourceY, box.height * (1 + padding * 2));

                    ctx.drawImage(
                        imageElement,
                        sourceX, sourceY, sourceWidth, sourceHeight,
                        0, 0, 120, 120
                    );

                    const thumbWrapper = document.createElement('div');
                    thumbWrapper.className = `face-thumb-wrapper ${extractions.length === 1 ? 'selected' : ''}`;
                    thumbWrapper.dataset.index = i;

                    const thumbImg = document.createElement('img');
                    thumbImg.className = 'face-thumb';
                    thumbImg.src = canvas.toDataURL();

                    thumbWrapper.appendChild(thumbImg);
                    DOM.facesPool.appendChild(thumbWrapper);

                    // Map selection event handling metrics
                    thumbWrapper.addEventListener('click', () => {
                        document.querySelectorAll('.face-thumb-wrapper').forEach(w => w.classList.remove('selected'));
                        thumbWrapper.classList.add('selected');
                        SystemState.selectedFaceIndex = i;
                        DOM.btnSearch.removeAttribute('disabled');
                    });
                }

                // Auto-select first parameter element signatures if uniqueness bounds detected cleanly
                if (extractions.length === 1) {
                    SystemState.selectedFaceIndex = 0;
                    DOM.btnSearch.removeAttribute('disabled');
                }
                
                DOM.btnReset.removeAttribute('disabled');

            } catch (err) {
                console.error("Failure running internal tracking face-api extraction logic: ", err);
                updateEngineStatus("Error processing image file parameters.", false);
            }
        }

        // Execute Deep Analytics Neural Search over full Gallery assets stack list matrix
        async function executeParallelGalleryFacialScan() {
            if (SystemState.selectedFaceIndex === null || SystemState.detectedFaceDescriptors.length === 0) return;

            const referenceDescriptor = SystemState.detectedFaceDescriptors[SystemState.selectedFaceIndex].descriptor;
            const faceMatcher = new faceapi.FaceMatcher(referenceDescriptor, SystemState.matchThreshold);

            DOM.progressPanel.style.display = 'block';
            DOM.btnSearch.setAttribute('disabled', 'true');
            DOM.fileInput.setAttribute('disabled', 'true');
            
            let matchedCount = 0;
            const cards = document.querySelectorAll('.photo-card');
            
            // Iterate over all mapped DOM card objects elements architectures running asynchronous logic transformations sequential
            for (let i = 0; i < cards.length; i++) {
                const card = cards[i];
                const imagePath = card.dataset.path;
                
                const percentProgress = Math.round(((i) / cards.length) * 100);
                updateEngineStatus(`Scanning gallery... [${i + 1}/${cards.length}]`, false);
                updateProgressBarUI(`Analyzing image asset: ${imagePath.split('/').pop()}`, percentProgress);

                try {
                    let singleGalleryDescriptorContainer = SystemState.galleryDescriptorsMap.get(imagePath);

                    // Lazy extract descriptors optimization layer cache processing
                    if (!singleGalleryDescriptorContainer) {
                        // Dynamically request image element component memory pointers context
                        const targetImgDomElement = card.querySelector('img');
                        
                        // Fallback verification mapping checks ensuring object availability context profiles valid state 
                        if(targetImgDomElement && targetImgDomElement.complete && targetImgDomElement.naturalWidth !== 0) {
                            singleGalleryDescriptorContainer = await faceapi.detectAllFaces(targetImgDomElement)
                                                                            .withFaceLandmarks()
                                                                            .withFaceDescriptors();
                            // Cache values data parameters dynamically inside memory layer map tracking
                            SystemState.galleryDescriptorsMap.set(imagePath, singleGalleryDescriptorContainer);
                        }
                    }

                    // Compute Euclidean matrix matches parameters context vectors profiles
                    let isMatchFound = false;
                    let bestMatchScore = null;

                    if (singleGalleryDescriptorContainer && singleGalleryDescriptorContainer.length > 0) {
                        for (const individualFace of singleGalleryDescriptorContainer) {
                            const matchResult = faceMatcher.findBestMatch(individualFace.descriptor);
                            // Lower distance values imply increased facial composition accuracy parameters metrics match vectors
                            if (matchResult.label !== 'unknown') {
                                isMatchFound = true;
                                const accuracyMetric = Math.round((1 - matchResult.distance) * 100);
                                if(bestMatchScore === null || accuracyMetric > bestMatchScore) {
                                    bestMatchScore = accuracyMetric;
                                }
                            }
                        }
                    }

                    // Modify visual layers DOM structural layout configurations states mapping properties definitions
                    if (isMatchFound) {
                        matchedCount++;
                        card.classList.remove('not-matched');
                        card.classList.add('matched');
                        
                        const scoreBadge = card.querySelector('.match-score');
                        if (scoreBadge) {
                            scoreBadge.textContent = `${bestMatchScore}% Match`;
                            scoreBadge.style.display = 'inline-block';
                        }
                    } else {
                        card.classList.remove('matched');
                        card.classList.add('not-matched');
                        const scoreBadge = card.querySelector('.match-score');
                        if (scoreBadge) scoreBadge.style.display = 'none';
                    }

                } catch (cardProcessingError) {
                    console.error(`Asset index compilation error bypassed processing for location path target profile: ${imagePath}`, cardProcessingError);
                }
            }

            // Completion processing architecture engine logs mappings state updates metrics configurations
            updateProgressBarUI("Recognition sequence complete", 100);
            updateEngineStatus("Search matching execution verified.", true);
            DOM.globalStats.textContent = "Scan Sequence Completed";
            
            // Display match analytics interface components parameters
            DOM.matchCountVal.textContent = matchedCount;
            DOM.matchCounterDisplay.style.display = 'block';
            DOM.fileInput.removeAttribute('disabled');

            setTimeout(() => {
                DOM.progressPanel.style.display = 'none';
            }, 1500);
        }

        function updateProgressBarUI(stepLabel, percentValue) {
            DOM.progressLabel.textContent = stepLabel;
            DOM.progressPercent.textContent = `${percentValue}%`;
            DOM.progressBar.style.width = `${percentValue}%`;
        }

        function clearDetectedFacesPreviewPool() {
            DOM.facesPool.innerHTML = '';
            DOM.pickerArea.style.display = 'none';
            SystemState.selectedFaceIndex = null;
            SystemState.detectedFaceDescriptors = [];
            SystemState.uploadedImageElement = null;
        }

        function resetGalleryCardsVisualStates() {
            const cards = document.querySelectorAll('.photo-card');
            cards.forEach(card => {
                card.className = 'photo-card glass-panel';
                const scoreBadge = card.querySelector('.match-score');
                if (scoreBadge) scoreBadge.style.display = 'none';
            });
            DOM.matchCounterDisplay.style.display = 'none';
        }

        function hardResetSearchEngineWorkspaceUX() {
            clearDetectedFacesPreviewPool();
            resetGalleryCardsVisualStates();
            DOM.fileInput.value = '';
            DOM.btnSearch.setAttribute('disabled', 'true');
            DOM.btnReset.setAttribute('disabled', 'true');
            DOM.progressPanel.style.display = 'none';
            updateEngineStatus("AI Engine Active & Primed", true);
            DOM.globalStats.textContent = "Engine Ready";
        }
    </script>
</body>
</html>
